version: 2

models:
  - name: aud_prospecting
    description: Use Case 2 prospecting audience. Sync this table with Activations.
    columns:
      - name: genome_id
        tests: [unique, not_null]
  - name: aud_cart_abandon
    description: Use Case 1 cart-abandon audience with trip details for personalization. Sync this table with Activations.
    columns:
      - name: genome_id
        tests: [unique, not_null]
  - name: aud_checkout_abandon
    description: >
      Use Case 1 trigger audience, page-path version: visited /checkout in the last 30 days, never reached
      /checkout/confirmation, and has not booked in the last 30 days.
    columns:
      - name: genome_id
        tests: [unique, not_null]
  - name: rpt_customer_genome_growth
    description: Daily Customer Genome audience growth.
    columns:
      - name: report_date
        tests: [unique, not_null]
